name: Build UE Mobile Inspector

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build ARM64 Native Library & Injector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install CMake & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure CMake
        run: |
          mkdir -p build_arm64
          cmake -B build_arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Shared Library & Injector
        run: |
          cmake --build build_arm64 --config Release -v > build_arm64.log 2>&1

      - name: Commit Log to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs-arm64
          git add build_arm64.log
          git commit -m "build log for arm64" || true
          git push origin build-logs-arm64 --force

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UEMobileInspector-arm64
          path: |
            build_arm64/libUEMobileInspector.so
            build_arm64/ue_injector
