name: Build UE Mobile Inspector

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Native Library (ARM64 Only)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        abi: [arm64-v8a]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install CMake & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure CMake
        run: |
          mkdir -p build_${{ matrix.abi }}
          cmake -B build_${{ matrix.abi }} -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Shared Library & Injector
        run: |
          cmake --build build_${{ matrix.abi }} --config Release -v > build_${{ matrix.abi }}.log 2>&1

      - name: Commit Log to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs-${{ matrix.abi }}
          git add build_${{ matrix.abi }}.log
          git commit -m "build log for ${{ matrix.abi }}" || true
          git push origin build-logs-${{ matrix.abi }} --force

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UEMobileInspector-arm64
          path: |
            build_${{ matrix.abi }}/libUEMobileInspector.so
            build_${{ matrix.abi }}/ue_injector

  create-release:
    name: Create GitHub Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UEMobileInspector-arm64/libUEMobileInspector.so
            UEMobileInspector-arm64/ue_injector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
